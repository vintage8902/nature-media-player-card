name: Bug report
description: Something isn't working as expected
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is happening, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Card version
      description: Check the browser console or the card JS filename for the version number.
      placeholder: "e.g. 0.4.68"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste your card YAML. Remove any sensitive values (entity IDs are fine).
      render: yaml
    validations:
      required: true

  - type: input
    id: player_type
    attributes:
      label: Player type
      description: What media player(s) are involved?
      placeholder: "e.g. Alexa Echo, Sonos, Apple TV, Music Assistant"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2025.5.0"
    validations:
      required: true

  - type: input
    id: spotifyplus_version
    attributes:
      label: SpotifyPlus version
      description: Leave blank if not relevant.
      placeholder: "e.g. 1.0.98"

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true

  - type: textarea
    id: console_errors
    attributes:
      label: Console errors
      description: Open browser DevTools → Console, reproduce the issue, and paste any errors here.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, recent HA updates, or anything else that might help.
